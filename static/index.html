<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIIR market — on-chain, no server</title>
<style>
  :root {
    --fg:#0f172a; --mut:#64748b; --acc:#2563eb; --acc2:#1d4ed8;
    --bg:#f1f5f9; --card:#fff; --line:#e2e8f0; --line2:#cbd5e1;
    --head:#0f172a; --headfg:#e2e8f0; --ok:#059669; --err:#b91c1c;
    --nk:#b45309; --nkbg:#fef3c7; --sh:#0f766e; --shbg:#ccfbf1; --us:#1d4ed8; --usbg:#dbeafe;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body { font:15px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         margin:0; background:var(--bg); color:var(--fg); }
  header { background:var(--head); color:var(--headfg); padding:12px 20px;
           display:flex; align-items:center; gap:14px; flex-wrap:wrap;
           position:sticky; top:0; z-index:20; box-shadow:0 1px 3px rgba(15,23,42,.25); }
  header .brand { font-weight:800; letter-spacing:.02em; font-size:16px; color:#fff;
                  text-decoration:none; display:flex; align-items:center; gap:8px; }
  header .brand .dot { width:9px; height:9px; border-radius:50%; background:var(--acc); }
  .searchwrap { flex:1 1 320px; position:relative; display:flex; gap:8px; }
  .searchwrap input { flex:1; font:13px/1.4 var(--mono); padding:9px 12px; border:1px solid #334155;
          border-radius:9px; background:#1e293b; color:#f1f5f9; outline:none; }
  .searchwrap input::placeholder { color:#94a3b8; }
  .searchwrap input:focus { border-color:var(--acc); }
  button { background:var(--acc); color:#fff; border:0; border-radius:9px; padding:9px 16px;
           cursor:pointer; font:inherit; font-weight:600; }
  button:hover { background:var(--acc2); }
  button.ghost { background:transparent; color:var(--acc); border:1px solid var(--line2); }
  button.ghost:hover { background:#eef2ff; }
  .searchwrap button { white-space:nowrap; }
  #suggest { position:absolute; top:calc(100% + 6px); left:0; right:64px; background:var(--card);
             border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(15,23,42,.14);
             overflow:hidden; display:none; }
  #suggest a { display:block; padding:10px 14px; text-decoration:none; color:var(--fg);
               border-bottom:1px solid var(--line); font-size:13px; }
  #suggest a:hover { background:#f8fafc; }
  #suggest a .s-n { font-weight:600; } #suggest a .s-a { color:var(--mut); font:12px var(--mono); word-break:break-all; }
  #suggest .s-empty { padding:12px 14px; color:var(--mut); font-size:13px; }
  main { max-width:1020px; margin:0 auto; padding:22px 20px 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:20px 22px; margin:0 0 18px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
  .hero { display:flex; flex-wrap:wrap; align-items:center; gap:18px;
          background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%); color:#f1f5f9;
          border:0; }
  .hero h1 { font-size:26px; margin:0 0 4px; color:#fff; }
  .hero p { margin:0; color:#94a3b8; font-size:14px; max-width:560px; }
  .stats { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .stat { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
          border-radius:10px; padding:8px 14px; }
  .stat .n { font-size:19px; font-weight:700; color:#fff; }
  .stat .k { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#94a3b8; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--mut);
       margin:0 0 12px; font-weight:700; }
  .mut { color:var(--mut); }
  .addr { font-family:var(--mono); font-size:12.5px; word-break:break-all; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; }
  tbody tr:hover { background:#f8fafc; }
  .chip { display:inline-block; border:1px solid var(--line2); background:var(--card); color:var(--fg);
          border-radius:20px; padding:5px 14px; font-size:13px; font-weight:600; cursor:pointer;
          margin:0 8px 8px 0; }
  .chip:hover { border-color:var(--acc); }
  .chip.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .tok { display:inline-block; border-radius:6px; padding:1px 8px; font-size:12px; font-weight:700; }
  .tok.nk { color:var(--nk); background:var(--nkbg); }
  .tok.sh { color:var(--sh); background:var(--shbg); }
  .tok.us { color:var(--us); background:var(--usbg); }
  .tok.ot { color:var(--mut); background:#f1f5f9; }
  .state { font-size:12px; font-weight:700; border-radius:6px; padding:1px 8px; }
  .state.open { color:var(--ok); background:#d1fae5; }
  .state.closed { color:var(--mut); background:#f1f5f9; }
  .escrow { background:#f8fafc; border:1px dashed var(--line2); border-radius:12px; padding:14px 16px;
            display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:14px; }
  .escrow .lab { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); }
  .escrow .full { display:none; font:12.5px var(--mono); word-break:break-all; color:var(--fg);
                  background:#fff; border:1px solid var(--line); border-radius:8px; padding:7px 10px; flex:1 1 100%; }
  .escrow .full.show { display:block; }
  .escrow .copy { position:relative; background:var(--acc); color:#fff; font-size:13px; }
  .escrow .copy:active { background:var(--acc2); }
  .escrow .hint { font-size:11.5px; color:var(--mut); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; }
  .kv { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:9px 12px; }
  .kv .k { font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--mut); }
  .kv .v { font-size:14px; margin-top:2px; word-break:break-all; }
  .empty { color:var(--mut); font-size:13px; padding:8px 0; }
  .err { background:#fdecec; color:var(--err); border:1px solid #f3c2c2; border-radius:10px; padding:12px 16px; }
   .logo { max-width:170px; max-height:170px; border-radius:10px; border:1px solid var(--line); }
   .seal { max-width:230px; height:auto; margin:10px 0; }
  .pre { white-space:pre-wrap; font-family:var(--mono); font-size:12.5px;
         background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .tabs { display:flex; gap:4px; margin-top:12px; flex-wrap:wrap; }
  .tabs a { color:var(--mut); text-decoration:none; font-size:13.5px; font-weight:600;
            padding:6px 12px; border-radius:8px; }
  .tabs a:hover { color:var(--acc); background:#eef2ff; }
  .pager { display:flex; gap:10px; align-items:center; margin:10px 0; }
  .note { font-size:12.5px; color:var(--mut); margin-top:8px; }
  footer { color:var(--mut); font-size:12px; text-align:center; padding:26px; }
  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--head);
           color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; font-weight:600;
           box-shadow:0 8px 24px rgba(15,23,42,.3); opacity:0; pointer-events:none;
           transition:opacity .18s ease; z-index:50; }
  #toast.show { opacity:1; }
  @media (max-width:640px) { main { padding:14px 12px 6px; } .hero h1 { font-size:21px; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="#/"><span class="dot"></span>SIIR market</a>
  <div class="searchwrap">
    <input id="q" placeholder="search companies or paste dapp_id::account_id" spellcheck="false" autocomplete="off">
    <button id="go">search</button>
    <div id="suggest"></div>
  </div>
</header>
<main id="main"></main>
<footer>read-only · data decoded in-browser from the shellnet mirror node · <code>static/core.js</code></footer>
<div id="toast"></div>
<script src="fields.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
