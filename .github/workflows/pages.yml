name: Deploy SIIR explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - "scripts/**"
      - "tests/**"
      - "contracts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python decoders compile
        run: python3 -m py_compile scripts/mirror.py scripts/gov_state.py scripts/gateway.py tests/gen_ground.py

      - name: JS/Python parity against committed fixture
        run: node static/parity.js tests/fixtures/py_ground.json

      - name: Bundle builds (on-chain UI)
        run: |
          npm install -g terser
          python3 static/bundle.py
          test -s static/bundle.html

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install terser (bundle minifier)
        run: npm install -g terser

      - name: Build the single-file on-chain bundle
        run: python3 static/bundle.py

      - name: Stage the site (static/ = site root)
        run: |
          mkdir -p _site
          cp static/index.html static/core.js static/app.js static/fields.js static/bundle.html _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
